<!DOCTYPE html>
<!--
Aplicativo: Direito Constitucional para Concursos
Versao: 1.0
Fase: 1
Status: funcional
Changelog v1.0 (Fase 1):
- Shell rebrandeado para Direito Constitucional

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC-ESTUDO v1.0 — Direito Constitucional</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f1f5f9; --surface: #ffffff; --surface-alt: #f8fafc;
    --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
    --primary: #2563eb; --primary-hover: #1d4ed8; --primary-soft: #dbeafe;
    --success: #16a34a; --success-soft: #dcfce7;
    --warning: #d97706; --warning-soft: #fef3c7;
    --danger: #dc2626; --danger-soft: #fee2e2;
    --purple: #7c3aed; --purple-soft: #f5f3ff;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 6px 20px rgba(15,23,42,.10);
  }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; font-size: 15px; -webkit-font-smoothing: antialiased; }
  #app { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 56px 1fr; grid-template-areas: "header header" "sidebar main"; min-height: 100vh; }
  .app-header { grid-area: header; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; position: sticky; top: 0; z-index: 20; }
  .menu-toggle { display: none; background: none; border: none; font-size: 22px; cursor: pointer; padding: 6px 10px; border-radius: 8px; color: var(--text); }
  .menu-toggle:hover { background: var(--surface-alt); }
  .brand { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 15px; }
  .brand .brand-sub { color: var(--text-muted); font-weight: 400; font-size: 12px; }
  .header-spacer { flex: 1; }
  .version-badge { background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; letter-spacing: .3px; }
  .sidebar { grid-area: sidebar; background: var(--surface); border-right: 1px solid var(--border); padding: 14px 10px; overflow-y: auto; }
  .nav-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); padding: 14px 12px 6px; font-weight: 700; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text); font-size: 14px; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; font-family: inherit; transition: background .12s ease; }
  .nav-item:hover { background: var(--surface-alt); }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .nav-item .nav-icon { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
  .nav-badge { background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 7px; margin-left: auto; }
  .nav-badge.soft { background: var(--primary-soft); color: var(--primary); }
  .main { grid-area: main; padding: 26px; overflow-y: auto; max-width: 1200px; width: 100%; }
  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.3px; }
  .page-subtitle { color: var(--text-muted); margin-bottom: 22px; font-size: 14px; }
  .section-title { font-size: 15px; font-weight: 700; margin: 26px 0 12px; letter-spacing: -.1px; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 6px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-card .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -.5px; }
  .stat-card .stat-hint { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .filter-pill { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13px; font-family: inherit; color: var(--text); font-weight: 500; }
  .filter-pill:hover { background: var(--surface-alt); }
  .filter-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .filter-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; }
  .filter-row label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
  .filter-row select, .filter-row input[type="number"] { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-family: inherit; font-size: 13.5px; color: var(--text); min-width: 170px; }
  .filter-row input[type="number"] { min-width: 90px; }
  .module-list { display: grid; gap: 8px; }
  .module-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease; text-align: left; width: 100%; font-family: inherit; color: inherit; }
  .module-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
  .module-card .mod-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; color: var(--text-muted); min-width: 62px; }
  .module-card .mod-info { flex: 1; min-width: 0; }
  .module-card .mod-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .module-card .mod-area { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .module-card .mod-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .module-card .mod-priority { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .4px; }
  .priority-alta { background: #fee2e2; color: #b91c1c; }
  .priority-media { background: #fed7aa; color: #c2410c; }
  .priority-baixa { background: #e2e8f0; color: #475569; }
  .badge-pill { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .4px; }
  .badge-aula { background: var(--success-soft); color: var(--success); }
  .badge-diag { background: var(--purple-soft); color: var(--purple); }
  .badge-real { background: #dbeafe; color: #1e40af; }

  .badge-medio { background: var(--warning-soft); color: var(--warning); }
  .badge-dificil { background: var(--danger-soft); color: var(--danger); }
  .badge-flash { background: #cffafe; color: #0e7490; }
  .badge-rev { background: #ede9fe; color: #6d28d9; }

  .badge-ok { background: var(--success-soft); color: var(--success); }
  .badge-sim { background: #fce7f3; color: #9d174d; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit; cursor: pointer; font-weight: 500; transition: background .12s ease; }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-purple { background: var(--purple); color: #fff; border-color: var(--purple); }
  .btn-purple:hover { filter: brightness(.94); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { filter: brightness(.94); }
  .btn-ghost { background: transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-lg { padding: 12px 20px; font-size: 15px; font-weight: 600; }
  .notice { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); padding: 18px 20px; color: var(--text-muted); font-size: 14px; }
  .notice strong { color: var(--text); }
  .info-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 18px; }
  .info-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .info-key { color: var(--text-muted); }
  .info-row .info-val { font-weight: 600; text-align: right; }
  .subtopic-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .subtopic-chip { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--text-muted); }
  .lesson-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; }
  .lesson-block h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .lesson-block h3 .lb-icon { font-size: 16px; }
  .lesson-block p { margin-bottom: 10px; font-size: 14.5px; }

  .lesson-block li { margin-bottom: 6px; font-size: 14.5px; }

  .lesson-block.block-pegadinha { border-left: 4px solid var(--warning); background: #fffbeb; }
  .lesson-block.block-erros { border-left: 4px solid var(--danger); background: #fef2f2; }

  .compare-table th, .compare-table td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .compare-table th { background: var(--surface-alt); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); }
  .compare-table tr:last-child td { border-bottom: none; }
  .prereq-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .prereq-tag { background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .professor-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .professor-answer { margin-top: 14px; padding: 14px 16px; border-left: 3px solid var(--primary); background: var(--surface-alt); border-radius: 6px; font-size: 14px; white-space: pre-wrap; }
  .professor-answer strong { display: block; margin-bottom: 6px; color: var(--primary); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .lesson-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .lesson-toolbar .lt-left { display: flex; gap: 8px; flex-wrap: wrap; }
  .lesson-read-indicator { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--success-soft); color: var(--success); }
  .lesson-read-indicator.pending { background: var(--warning-soft); color: var(--warning); }
  .diag-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .diag-progress-bar { flex: 1; height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .diag-progress-fill { height: 100%; background: var(--purple); transition: width .25s ease; }
  .diag-progress-fill.sim { background: #db2777; }
  .diag-progress-label { font-size: 13px; font-weight: 600; color: var(--text-muted); min-width: 70px; text-align: right; }
  .diag-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; }
  .diag-meta .tag { background: var(--purple-soft); color: var(--purple); padding: 3px 10px; border-radius: 999px; font-weight: 600; letter-spacing: .3px; }
  .diag-question { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 12px; }
  .diag-question h2 { font-size: 17px; font-weight: 600; line-height: 1.45; margin-bottom: 18px; letter-spacing: -.1px; }
  .diag-options { display: grid; gap: 8px; }
  .diag-option { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; font-family: inherit; text-align: left; font-size: 14.5px; color: var(--text); transition: border-color .12s ease, background .12s ease; line-height: 1.45; }
  .diag-option:hover:not(:disabled) { border-color: var(--purple); background: var(--purple-soft); }
  .diag-option:disabled { cursor: default; }
  .diag-option .opt-letter { font-weight: 700; min-width: 18px; color: var(--text-muted); }
  .diag-option.selected { border-color: var(--purple); background: var(--purple-soft); }
  .diag-option.correct { border-color: var(--success); background: var(--success-soft); }
  .diag-option.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .diag-option.correct .opt-letter, .diag-option.wrong .opt-letter { color: var(--text); }
  .diag-feedback { margin-top: 18px; padding: 14px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
  .diag-feedback.ok { background: var(--success-soft); border-left: 4px solid var(--success); }
  .diag-feedback.no { background: var(--danger-soft); border-left: 4px solid var(--danger); }
  .diag-feedback strong { display: block; margin-bottom: 6px; }
  .diag-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .self-assess { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .self-assess .btn { padding: 12px 20px; font-size: 14.5px; }
  .result-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .result-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .result-stat .rs-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .result-stat .rs-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .subtopic-result { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; border-left-width: 4px; border-left-style: solid; }

  .status-badge.status-duvida { background: var(--warning-soft); color: var(--warning); }

  .subtopic-result .signals { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin: 6px 0 10px; }

  .subtopic-result .recommendation strong { color: var(--text); }

  .question-preview .qp-text { font-size: 14px; color: var(--text); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .qp-status.qs-nova { background: var(--surface-alt); color: var(--text-muted); }
  .qp-status.qs-acerto { background: var(--success-soft); color: var(--success); }
  .qp-status.qs-erro { background: var(--danger-soft); color: var(--danger); }
  .run-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .run-toolbar .rt-info { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--text-muted); }

  .q-card .q-statement { font-size: 16px; line-height: 1.55; font-weight: 500; margin-bottom: 18px; letter-spacing: -.1px; }

  function computeDiagnosticResult(moduleId, answers) {
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return null;
    var bySubtopic = {}, totalPontos = 0, totalSinais = 0;
    for (var i = 0; i < diag.itens.length; i++) {
      var item = diag.itens[i];
      var sub = item.subtopico;
      if (!bySubtopic[sub]) bySubtopic[sub] = { acertos: 0, erros: 0, sabia: 0, nao_sabia: 0, total: 0 };
      var resp = answers[item.id];
      bySubtopic[sub].total += 1;
      if (isObjective(item)) {
        if (resp === item.gabarito) { bySubtopic[sub].acertos += 1; totalPontos += 1; } else bySubtopic[sub].erros += 1;
        totalSinais += 1;
      } else if (item.tipo === 'autoavaliacao') {
        if (resp === 'sabia') { bySubtopic[sub].sabia += 1; totalPontos += 1; } else if (resp === 'nao_sabia') bySubtopic[sub].nao_sabia += 1;
        totalSinais += 1;
      }
    }
    var result = { bySubtopic: {} };
    for (var subName in bySubtopic) {
      if (!bySubtopic.hasOwnProperty(subName)) continue;
      var s = bySubtopic[subName];
      var positivos = s.acertos + s.sabia, negativos = s.erros + s.nao_sabia;
      var status;
      if (s.erros === 0 && s.nao_sabia === 0 && positivos >= 1) status = 'conhecido';
      else if (positivos === 0 && negativos >= 1) status = 'desconhecido';
      else status = 'duvida';
      var rec;
      if (status === 'conhecido') rec = 'Você demonstra bom domínio neste subtópico. Siga para a aula (revisão) e mantenha revisões periódicas.';
      else if (status === 'duvida') rec = 'Há base, mas o domínio é parcial. Estude a aula com atenção, foque nos exemplos e nas comparações, e refaça este diagnóstico depois de revisar.';
      else rec = 'Trate este subtópico como prioridade. Estude a aula desde o início, sem pular a explicação simples. Refaça o diagnóstico em seguida.';
      result.bySubtopic[subName] = { status: status, acertos: s.acertos, erros: s.erros, sabia: s.sabia, nao_sabia: s.nao_sabia, total: s.total, recommendation: rec };
    }
    var dominio = 0;
    if (totalSinais > 0) {
      dominio = totalPontos / totalSinais;
      if (negativosNoTotal(bySubtopic) > 0) dominio = dominio * 0.9;
      dominio = Math.max(0, Math.min(1, dominio));
    }
    result.dominioEstimado = Math.round(dominio * 100) / 100;
    result.completedAt = new Date().toISOString();
    return result;

  function filterQuestions() {
    return QUESTIONS.filter(function (q) {
      if (questionFilter.area !== 'todas' && q.area !== questionFilter.area) return false;
      if (questionFilter.moduloId !== 'todos' && q.moduloId !== questionFilter.moduloId) return false;
      if (questionFilter.dificuldade !== 'todas' && q.dificuldade !== Number(questionFilter.dificuldade)) return false;

  function startQuestionSession(ids, modo) {

    var idsArr = shuffleArray(list.map(function (q) { return q.id; }));

    navigate('questao-run');

  function commitQuestionAnswer(qid, altId) {
    var q = getQuestion(qid);
    if (!q) return;
    var qs = getQuestionUserState(qid);
    var correta = altId === q.gabarito;
    qs.tentativas += 1;
    if (correta) qs.acertos += 1; else qs.erros += 1;
    qs.ultimaResposta = altId; qs.ultimaCorreta = correta; qs.ultimaTentativa = new Date().toISOString();
    qs.status = correta ? 'acerto' : 'erro';
    qs.historico.push({ data: qs.ultimaTentativa, resposta: altId, correta: correta });
    if (qs.historico.length > 30) qs.historico = qs.historico.slice(-30);
    if (correta) {
      if (qs.intervaloAtual < 0) qs.intervaloAtual = 0;
      else if (qs.intervaloAtual < Q_INTERVALS.length - 1) qs.intervaloAtual += 1;
      qs.proximaRevisao = addDaysIso(Q_INTERVALS[qs.intervaloAtual]);
    } else {
      qs.intervaloAtual = 0;
      qs.proximaRevisao = addDaysIso(Q_INTERVALS[0]);

    if (correta) AppState.stats.acertos += 1; else AppState.stats.erros += 1;
    var st = getModuleUserState(q.moduloId);

  function filterForSimulado() {
    var cfg = simuladoConfig;
    return QUESTIONS.filter(function (q) {
      if (cfg.area !== 'todas' && q.area !== cfg.area) return false;
      if (cfg.moduloId !== 'todos' && q.moduloId !== cfg.moduloId) return false;
      if (cfg.dificuldade !== 'todas' && q.dificuldade !== Number(cfg.dificuldade)) return false;

    });
  }
  function quantidadeAlvo() {
    if (simuladoConfig.quantidade === 'custom') {
      var n = parseInt(simuladoConfig.customQty, 10);

  function startSimulado(modoForcado) {
    var modo = modoForcado || simuladoConfig.modo;
    var pool;
    if (modo === 'PROVA_CONCURSO') {
      pool = filterForSimulado().filter(function (q) { return q.tipo === 'REAL'; });
      if (pool.length === 0) {
        var prosseguir = window.confirm(
          'Não há questões REAIS no banco atual.\n\n' +
          'Deseja rodar um Simulado personalizado (com todas as questões disponíveis) no lugar?'
        );
        if (prosseguir) {
          simuladoConfig.modo = 'SIMULADO';
          simuladoConfig.tipo = 'TODAS';
          pool = filterForSimulado();
        } else {
          return;
        }
      }
    } else {
      pool = filterForSimulado();
      if (pool.length === 0) {
        var limpar = window.confirm(
          'Nenhuma questão corresponde aos filtros atuais.\n\n' +

    }

      return;
    }
    var qtd = quantidadeAlvo();
    if (qtd === 0) {

    var ids = shuffleArray(pool.map(function (q) { return q.id; })).slice(0, Math.min(qtd, pool.length));
    if (ids.length === 0) { window.alert('Não há questões suficientes.'); return; }
    simuladoRunning = {
      ids: ids,
      index: 0,
      respostas: {},
      startedAt: new Date().toISOString(),
      config: {
        modo: (modo === 'PROVA_CONCURSO' && simuladoConfig.modo === 'PROVA_CONCURSO') ? 'PROVA_CONCURSO' : 'SIMULADO',
        quantidade: qtd,
        area: simuladoConfig.area,
        moduloId: simuladoConfig.moduloId,
        dificuldade: simuladoConfig.dificuldade,
        tipo: simuladoConfig.tipo
      }
    };
    navigate('simulado-run');
  }
  function answerSimulado(altId) {
    if (!simuladoRunning) return;
    var qid = simuladoRunning.ids[simuladoRunning.index];
    simuladoRunning.respostas[qid] = altId;
    render();
  }
  function clearSimuladoAnswer() {
    if (!simuladoRunning) return;
    var qid = simuladoRunning.ids[simuladoRunning.index];
    delete simuladoRunning.respostas[qid];
    render();
  }
  function nextSimulado() { if (simuladoRunning && simuladoRunning.index < simuladoRunning.ids.length - 1) { simuladoRunning.index += 1; render(); var m = document.getElementById('main'); if (m) m.scrollTop = 0; } }
  function prevSimulado() { if (simuladoRunning && simuladoRunning.index > 0) { simuladoRunning.index -= 1; render(); var m = document.getElementById('main'); if (m) m.scrollTop = 0; } }
  function gotoSimuladoIndex(i) {
    if (!simuladoRunning) return;
    var n = parseInt(i, 10);
    if (!isFinite(n) || n < 0 || n >= simuladoRunning.ids.length) return;
    simuladoRunning.index = n;
    render();
    var main = document.getElementById('main');
    if (main) main.scrollTop = 0;
  }
  function cancelSimulado() {
    var ok = window.confirm('Cancelar o simulado? Nenhuma resposta será registrada.');
    if (!ok) return;
    simuladoRunning = null;
    navigate('simulados');
  }
  function finishSimulado() {
    if (!simuladoRunning) return;
    var total = simuladoRunning.ids.length;
    var respondidas = 0;
    for (var i = 0; i < total; i++) {
      if (simuladoRunning.respostas[simuladoRunning.ids[i]] != null) respondidas++;
    }
    if (respondidas < total) {
      var ok = window.confirm('Você respondeu ' + respondidas + ' de ' + total + ' questões.\n\nDeseja finalizar mesmo assim? As questões não respondidas serão consideradas em branco.');
      if (!ok) return;
    }
    var ids = simuladoRunning.ids;
    var respostas = simuladoRunning.respostas;
    var acertos = 0;
    var porModulo = {}, porDificuldade = {}, porTipo = {};
    for (var j = 0; j < ids.length; j++) {
      var q = getQuestion(ids[j]);
      if (!q) continue;
      var resp = respostas[q.id];
      var correta = resp === q.gabarito;
      if (correta) acertos++;
      if (resp != null) commitQuestionAnswer(q.id, resp);
      if (!porModulo[q.moduloId]) porModulo[q.moduloId] = { total: 0, acertos: 0, respondidas: 0 };
      porModulo[q.moduloId].total++; if (correta) porModulo[q.moduloId].acertos++; if (resp != null) porModulo[q.moduloId].respondidas++;
      var dl = difficultyLabel(q.dificuldade);
      if (!porDificuldade[dl]) porDificuldade[dl] = { total: 0, acertos: 0, respondidas: 0 };
      porDificuldade[dl].total++; if (correta) porDificuldade[dl].acertos++; if (resp != null) porDificuldade[dl].respondidas++;
      if (!porTipo[q.tipo]) porTipo[q.tipo] = { total: 0, acertos: 0, respondidas: 0 };
      porTipo[q.tipo].total++; if (correta) porTipo[q.tipo].acertos++; if (resp != null) porTipo[q.tipo].respondidas++;
    }
    var naoRespondidas = total - respondidas;
    var erros = respondidas - acertos;
    var pct = total > 0 ? Math.round((acertos / total) * 100) : 0;
    var sim = {
      id: 'SIM-' + Date.now().toString(36).toUpperCase(),
      tipo: simuladoRunning.config.modo,
      quantidade: total,
      respondidas: respondidas,
      naoRespondidas: naoRespondidas,
      filtros: {
        area: simuladoRunning.config.area,
        moduloId: simuladoRunning.config.moduloId,
        dificuldade: simuladoRunning.config.dificuldade,
        tipo: simuladoRunning.config.tipo
      },
      questoesIds: ids.slice(),
      respostas: Object.assign({}, respostas),
      iniciadoEm: simuladoRunning.startedAt,
      finalizadoEm: new Date().toISOString(),
      resultado: {
        acertos: acertos,
        erros: erros,
        naoRespondidas: naoRespondidas,
        respondidas: respondidas,
        percentual: pct,
        porModulo: porModulo,
        porDificuldade: porDificuldade,
        porTipo: porTipo
      }
    };
    AppState.simulados.push(sim);
    AppState.stats.simuladosRealizados = (AppState.stats.simuladosRealizados || 0) + 1;
    saveState();
    currentSimuladoId = sim.id;
    simuladoRunning = null;
    navigate('simulado-result');
    renderNavBadges();
  }
  function deleteSimulado(id) {
    var ok = window.confirm('Excluir este simulado do histórico? Essa ação não pode ser desfeita.');
    if (!ok) return;
    var arr = [];

  function applyTheme(theme) {

  function renderDashboard() {
    var stats = AppState.stats;
    var taxa = stats.questoesRespondidas > 0 ? Math.round((stats.acertos / stats.questoesRespondidas) * 100) : 0;
    var totalModulos = MODULES.length;
    var emEstudo = 0, concluidos = 0;
    for (var i = 0; i < MODULES.length; i++) { var st = getModuleUserState(MODULES[i].id); if (st.status === 'em_estudo') emEstudo++; if (st.status === 'concluido') concluidos++; }
    var diagFeitos = 0;
    for (var d = 0; d < MODULES.length; d++) { var dst = AppState.modules[MODULES[d].id]; if (dst && dst.diagnostico) diagFeitos++; }
    var qReal = qRealCount(), qDid = qDidCount();
    var dueN = countDueAll();
    var errN = countErrorsAll();
    var simCount = AppState.simulados.length;
    var bestSim = null;
    for (var s = 0; s < AppState.simulados.length; s++) {
      var r = AppState.simulados[s].resultado;
      if (bestSim == null || (r.percentual > bestSim)) bestSim = r.percentual;
    }

    var sugestoes = [];
    var dueQ = getDueQuestions();
    var dueF = getDueFlashcards();
    if (dueQ.length > 0 || dueF.length > 0) {
      sugestoes.push({ tipo: 'revisao', titulo: 'Revisão pendente', descricao: dueQ.length + ' questão(ões) e ' + dueF.length + ' flashcard(s) para revisar hoje.' });
    }
    if (errN > 0) {
      sugestoes.push({ tipo: 'erros', titulo: 'Erros em aberto', descricao: errN + ' questão(ões) com erro aguardando revisão dedicada.' });
    }
    for (var j = 0; j < MODULES.length && sugestoes.length < 4; j++) {
      var m = MODULES[j];
      if (m.prioridade !== 'alta') continue;
      if (!getDiagnosticByModuleId(m.id) && !getLessonByModuleId(m.id)) continue;
      var ms = getModuleUserState(m.id);
      if (ms.status === 'concluido') continue;
      sugestoes.push({ tipo: 'modulo', modulo: m });
    }

    var html = '';
    html += '<h1 class="page-title">Dashboard</h1>';
    html += '<p class="page-subtitle">Visão geral do seu progresso em Direito Constitucional. Dados salvos localmente no navegador.</p>';
    html += '<div class="cards-grid">';
    html += statCard('Questões respondidas', stats.questoesRespondidas, qReal + ' reais · ' + qDid + ' didáticas');
    html += statCard('Taxa de acerto', taxa + '%', stats.acertos + ' acertos / ' + stats.erros + ' erros');
    html += statCard('Simulados realizados', simCount, bestSim != null ? 'Melhor aproveitamento: ' + bestSim + '%' : 'Nenhum ainda');
    html += statCard('Revisões pendentes', dueN, dueN === 0 ? 'Nada vencido agora' : 'Vencidas ou para hoje');

    html += '<div style="margin:6px 0 14px;display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<button class="btn btn-primary" data-nav="estatisticas">📊 Ver estatísticas</button>';
    html += '</div>';

    html += '<h2 class="section-title">O que estudar hoje?</h2>';
    if (sugestoes.length === 0) html += '<div class="notice"><strong>Sem sugestões ainda.</strong> Comece pela aba <strong>Módulos</strong>.</div>';
    else {
      html += '<div class="module-list">';
      for (var sg_i = 0; sg_i < sugestoes.length; sg_i++) {
        var sg = sugestoes[sg_i];
        if (sg.tipo === 'revisao') {
          html += '<button class="module-card" data-nav="revisao">';
          html += '<span class="mod-id">REV</span>';
          html += '<span class="mod-info"><span class="mod-title">🔁 ' + esc(sg.titulo) + '</span><span class="mod-area">' + esc(sg.descricao) + '</span></span>';
          html += '<span class="mod-badges"><span class="badge-pill badge-rev">Revisar</span></span></button>';

          html += '<button class="module-card" data-nav="erros">';
          html += '<span class="mod-id">ERR</span>';
          html += '<span class="mod-info"><span class="mod-title">❌ ' + esc(sg.titulo) + '</span><span class="mod-area">' + esc(sg.descricao) + '</span></span>';
          html += '<span class="mod-badges"><span class="badge-pill badge-err">Erros</span></span></button>';
        } else if (sg.modulo) {
          html += moduleCardHtml(sg.modulo);

      html += '</div>';

      '<strong>DC-ESTUDO v1.0 — Fase 1.</strong> ' +

  function summarizeResult(result) {
    var c = 0, d = 0, x = 0;
    var bs = result.bySubtopic || {};
    for (var k in bs) {
      if (!bs.hasOwnProperty(k)) continue;
      if (bs[k].status === 'conhecido') c++;
      else if (bs[k].status === 'duvida') d++;
      else if (bs[k].status === 'desconhecido') x++;
    }
    return { conhecido: c, duvida: d, desconhecido: x };
  }
  function infoRow(key, value) { return '<div class="info-row"><span class="info-key">' + esc(key) + '</span><span class="info-val">' + esc(value) + '</span></div>'; }

  function renderDiagnosticRunning() {
    var moduleId = diagRunning.moduleId;
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return '<h1 class="page-title">Diagnóstico não encontrado</h1><button class="btn" data-nav="modulos">← Voltar</button>';
    var m = getModule(moduleId);
    var idx = diagRunning.itemIndex, total = diag.itens.length;
    if (idx < 0) idx = 0; if (idx >= total) idx = total - 1;
    var item = diag.itens[idx];
    var answered = Object.prototype.hasOwnProperty.call(diagRunning.answers, item.id);
    var userAnswer = diagRunning.answers[item.id];
    var percent = Math.round((idx / total) * 100);
    var html = '';
    html += '<div class="diag-progress"><div class="diag-progress-bar"><div class="diag-progress-fill" style="width:' + percent + '%"></div></div><div class="diag-progress-label">Item ' + (idx + 1) + ' / ' + total + '</div></div>';
    html += '<h1 class="page-title">Diagnóstico — ' + esc(m ? m.titulo : moduleId) + '</h1>';
    html += '<p class="page-subtitle">Módulo ' + esc(moduleId) + ' · ' + esc(DIAG_TYPE_LABELS[item.tipo] || item.tipo) + '</p>';
    html += '<div class="diag-meta"><span class="tag">Subtópico: ' + esc(item.subtopico) + '</span><span class="tag">' + esc(DIAG_TYPE_LABELS[item.tipo] || item.tipo) + '</span></div>';
    html += '<div class="diag-question"><h2>' + esc(item.pergunta) + '</h2>';
    if (isObjective(item)) {
      html += '<div class="diag-options">';
      for (var a = 0; a < item.alternativas.length; a++) {
        var alt = item.alternativas[a];
        var cls = 'diag-option';
        if (answered) { if (alt.id === item.gabarito) cls += ' correct'; else if (alt.id === userAnswer) cls += ' wrong'; }
        else if (alt.id === userAnswer) cls += ' selected';
        html += '<button class="' + cls + '" data-action="diag-answer" data-alt="' + esc(alt.id) + '"' + (answered ? ' disabled' : '') + '><span class="opt-letter">' + esc(alt.id) + '</span><span>' + esc(alt.texto) + '</span></button>';
      }
      html += '</div>';
      if (answered) {
        var acertou = userAnswer === item.gabarito;
        html += '<div class="diag-feedback ' + (acertou ? 'ok' : 'no') + '"><strong>' + (acertou ? '✓ Correto' : '✗ Incorreto') + '</strong>' + esc(item.explicacao) + '</div>';
      }
    } else if (item.tipo === 'autoavaliacao') {
      html += '<p style="color:var(--text-muted);font-size:14px;margin-bottom:8px;">Marque com sinceridade.</p>';
      if (answered) {
        html += '<div class="diag-feedback ' + (userAnswer === 'sabia' ? 'ok' : 'no') + '"><strong>' + (userAnswer === 'sabia' ? 'Você marcou: Eu sabia' : 'Você marcou: Eu não sabia') + '</strong>Gabarito conceitual: ' + esc(item.resposta) + '</div>';
      } else {
        html += '<div class="self-assess"><button class="btn btn-primary" data-action="diag-answer" data-alt="sabia">Eu sabia</button><button class="btn" data-action="diag-answer" data-alt="nao_sabia">Eu não sabia</button></div>';
      }
    }
    html += '<div class="diag-actions"><div>';
    html += idx > 0 ? '<button class="btn" data-action="diag-prev">← Item anterior</button>' : '<button class="btn" data-action="diag-cancel">Cancelar</button>';
    html += '</div><div>';
    if (answered && idx < total - 1) html += '<button class="btn btn-primary" data-action="diag-next">Próximo →</button>';
    else if (answered && idx === total - 1) html += '<button class="btn btn-purple" data-action="diag-finish">Finalizar diagnóstico →</button>';
    html += '</div></div></div>';
    html += footerHtml();
    return html;
  }

  function renderDiagnosticResult() {
    var moduleId = currentModuleId;
    var m = getModule(moduleId);
    if (!m) return '<h1 class="page-title">Módulo não encontrado</h1><button class="btn" data-nav="modulos">← Voltar</button>';
    var st = getModuleUserState(moduleId);
    if (!st.diagnostico || !st.diagnostico.result) return '<h1 class="page-title">Nenhum diagnóstico registrado</h1><button class="btn btn-primary" data-action="start-diag" data-module-id="' + esc(moduleId) + '">Fazer diagnóstico</button>';
    var r = st.diagnostico.result, bs = r.bySubtopic || {};
    var subtopicos = [];
    for (var k in bs) if (bs.hasOwnProperty(k)) subtopicos.push(k);
    subtopicos.sort(function (a, b) { var order = { 'desconhecido': 0, 'duvida': 1, 'conhecido': 2 }; return (order[bs[a].status] || 9) - (order[bs[b].status] || 9); });
    var resumo = summarizeResult(r);
    var totalSub = subtopicos.length;
    var html = '';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" data-action="open-module" data-module-id="' + esc(moduleId) + '">← Módulo ' + esc(moduleId) + '</button><button class="btn" data-nav="modulos">📚 Módulos</button></div>';
    html += '<div><button class="btn btn-purple" data-action="refazer-diag" data-module-id="' + esc(moduleId) + '">Refazer diagnóstico</button></div></div>';
    html += '<h1 class="page-title">Resultado do diagnóstico</h1>';
    html += '<p class="page-subtitle">' + esc(m.id) + ' — ' + esc(m.titulo) + ' · Concluído em ' + esc(formatDate(r.completedAt)) + '</p>';
    html += '<div class="result-summary">';
    html += resultStat('Subtópicos avaliados', totalSub);
    html += resultStat('Conhecidos', resumo.conhecido);
    html += resultStat('Em dúvida', resumo.duvida);
    html += resultStat('Desconhecidos', resumo.desconhecido);
    html += resultStat('Domínio estimado', Math.round((r.dominioEstimado || 0) * 100) + '%');
    html += '</div>';
    html += '<h2 class="section-title">Análise por subtópico</h2>';
    html += '<p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">O status é calculado cruzando acertos, erros e autoavaliação.</p>';
    for (var i = 0; i < subtopicos.length; i++) {
      var sub = subtopicos[i], d = bs[sub];
      html += '<div class="subtopic-result status-' + esc(d.status) + '">';
      html += '<h3>' + esc(sub) + '<span class="status-badge status-' + esc(d.status) + '">' + esc(STATUS_LABELS[d.status]) + '</span></h3>';
      html += '<div class="signals"><span>Acertos: <strong>' + d.acertos + '</strong></span><span>Erros: <strong>' + d.erros + '</strong></span>';
      if (d.sabia > 0 || d.nao_sabia > 0) html += '<span>Autoavaliação — sabia: <strong>' + d.sabia + '</strong> / não sabia: <strong>' + d.nao_sabia + '</strong></span>';
      html += '</div><div class="recommendation">' + esc(d.recommendation) + '</div></div>';
    }
    html += '<h2 class="section-title">Próximos passos</h2><div class="notice">';
    if (resumo.desconhecido > 0) html += '<strong>Prioridade alta.</strong> Você tem ' + resumo.desconhecido + ' subtópico(s) desconhecido(s). Estude a aula desde o início e refaça o diagnóstico.';
    else if (resumo.duvida > 0) html += '<strong>Reforço recomendado.</strong> ' + resumo.duvida + ' subtópico(s) em dúvida. Releia a aula e refaça este diagnóstico.';
    else html += '<strong>Bom desempenho.</strong> Todos os subtópicos foram classificados como conhecidos.';
    html += '</div>';
    html += '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">';
    var lesson = getLessonByModuleId(moduleId);
    if (lesson) html += '<button class="btn btn-primary" data-action="open-lesson" data-lesson-id="' + esc(lesson.id) + '">Estudar aula →</button>';
    html += '<button class="btn" data-action="start-diag" data-module-id="' + esc(moduleId) + '">Refazer agora</button>';
    html += '</div>';
    html += footerHtml();
    return html;
  }
  function resultStat(label, value) { return '<div class="result-stat"><div class="rs-label">' + esc(label) + '</div><div class="rs-value">' + esc(value) + '</div></div>'; }

  function renderQuestions() {
    var areas = ['todas'].concat(Object.keys(AREA_LABELS));
    var areaPills = '';
    for (var i = 0; i < areas.length; i++) {
      var a = areas[i];
      var label = a === 'todas' ? 'Todas as áreas' : (AREA_LABELS[a] || a);
      var active = (questionFilter.area === a) ? ' active' : '';
      areaPills += '<button class="filter-pill' + active + '" data-qf-area="' + a + '">' + esc(label) + '</button>';
    }
    var moduleOptions = '<option value="todos">Todos os módulos</option>';
    for (var j = 0; j < MODULES.length; j++) {
      var mo = MODULES[j];
      var hasQ = QUESTIONS.some(function (q) { return q.moduloId === mo.id; });
      if (!hasQ && questionFilter.moduloId !== mo.id) continue;
      var sel = questionFilter.moduloId === mo.id ? ' selected' : '';
      moduleOptions += '<option value="' + esc(mo.id) + '"' + sel + '>' + esc(mo.id + ' — ' + mo.titulo) + '</option>';
    }
    var diffOptions = '';
    var diffs = [['todas','Todas as dificuldades'], ['1','Fácil'], ['2','Médio'], ['3','Difícil']];
    for (var d = 0; d < diffs.length; d++) {
      var sel2 = questionFilter.dificuldade === diffs[d][0] ? ' selected' : '';
      diffOptions += '<option value="' + diffs[d][0] + '"' + sel2 + '>' + esc(diffs[d][1]) + '</option>';
    }
    var tipoOptions = '';
    var tipos = [['TODAS','Todas'], ['DIDATICA','Somente didáticas'], ['REAL','Somente reais']];
    for (var t = 0; t < tipos.length; t++) {
      var sel3 = questionFilter.tipo === tipos[t][0] ? ' selected' : '';
      tipoOptions += '<option value="' + tipos[t][0] + '"' + sel3 + '>' + esc(tipos[t][1]) + '</option>';
    }
    var filtered = filterQuestions();
    var html = '';
    html += '<h1 class="page-title">Questões</h1>';
    html += '<p class="page-subtitle">Motor de questões — filtros, correção, explicação pedagógica estruturada, histórico e desempenho.</p>';
    html += '<div class="type-banner"><span class="badge-pill badge-did">DIDÁTICA</span><span>O banco atual contém <strong>' + QUESTIONS.length + ' questões</strong>. ';
    if (QUESTIONS.length === 0) html += 'Nenhuma questão cadastrada ainda — serão adicionadas nas próximas fases. ';
    html += 'Use <strong>Banco de Questões</strong> para importar questões reais com banca, órgão, ano, prova e fonte.</span></div>';
    html += '<h2 class="section-title">Filtros</h2>';
    html += '<div class="filters">' + areaPills + '</div>';
    html += '<div class="filter-row">';

    html += '<label>Dificuldade</label><select id="qFilterDificuldade">' + diffOptions + '</select>';
    html += '<label>Tipo</label><select id="qFilterTipo">' + tipoOptions + '</select>';
    html += '</div>';
    html += '<div style="margin:14px 0;display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<button class="btn btn-primary" data-action="start-question-session"' + (filtered.length === 0 ? ' disabled' : '') + '>▶ Iniciar sessão (' + filtered.length + ' questão(ões))</button>';

    html += '</div>';

    if (filtered.length === 0) html += '<div class="notice">Nenhuma questão corresponde aos filtros escolhidos.</div>';

          else if (qs.status === 'erro') { statusClass = 'qs-erro'; statusText = 'Erro · ' + qs.acertos + '/' + qs.tentativas; }
        }
        var revInfo = '';
        if (qs && qs.proximaRevisao) revInfo = ' · próxima revisão: ' + formatDateShort(qs.proximaRevisao);
        html += '<div class="question-preview">';

  function renderQuestionRun() {

    html += '<div class="q-card">';
    html += '<div class="q-head"><span class="q-id">' + esc(q.id) + '</span>';

  function renderBreakdown(map, labelFn) {

  function validateIncomingQuestion(q, existingIds) {
    var errors = [];
    if (!q || typeof q !== 'object') return ['Item não é objeto.'];
    if (!q.id) errors.push('Sem ID.');
    if (q.id && existingIds.indexOf(q.id) !== -1) errors.push('ID já existe (' + q.id + ').');
    if (q.tipo !== 'REAL' && q.tipo !== 'DIDATICA') errors.push('tipo deve ser REAL ou DIDATICA.');
    if (!q.enunciado) errors.push('Sem enunciado.');
    if (!Array.isArray(q.alternativas) || q.alternativas.length < 2) errors.push('Alternativas insuficientes.');
    else {
      var altIds = q.alternativas.map(function (a) { return a.id; });
      if (altIds.indexOf(q.gabarito) === -1) errors.push('Gabarito não corresponde a nenhuma alternativa.');
    }
    if (!q.explicacao || !q.explicacao.correta) errors.push('Explicação estruturada ausente (campo "correta").');
    if (!q.moduloId || !getModule(q.moduloId)) errors.push('moduloId inválido.');
    if (q.tipo === 'REAL') {
      if (!q.banca) errors.push('REAL sem banca.');
      if (!q.orgao) errors.push('REAL sem órgão.');
      if (!q.ano) errors.push('REAL sem ano.');
      if (!q.prova) errors.push('REAL sem prova.');
      if (!q.fonte || !q.fonte.descricao) errors.push('REAL sem fonte verificável.');
    }
    return errors;
  }
  function importQuestionsFromText(text) {
    var incoming;
    try { incoming = JSON.parse(text); }
    catch (e) { importReport = { status: 'err', title: 'JSON inválido', messages: [String(e.message)] }; render(); return; }
    if (!Array.isArray(incoming)) { importReport = { status: 'err', title: 'Esperado um array JSON', messages: [] }; render(); return; }
    var existingIds = QUESTIONS.map(function (q) { return q.id; });
    var aceitas = 0, rejeitadas = 0, messages = [];
    for (var i = 0; i < incoming.length; i++) {
      var q = incoming[i];
      var errs = validateIncomingQuestion(q, existingIds);
      if (errs.length > 0) { rejeitadas++; messages.push('Item ' + (i + 1) + ' (' + (q && q.id ? q.id : 'sem id') + '): ' + errs.join(' · ')); }
      else {
        if (!q.area && q.moduloId) { var mm = getModule(q.moduloId); if (mm) q.area = mm.area; }
        if (!q.subtema) q.subtema = '';
        if (!q.dificuldade) q.dificuldade = 2;
        if (!q.prioridade) q.prioridade = 'alta';
        if (!q.tags) q.tags = [];
        if (q.tipo === 'DIDATICA') { q.banca = undefined; q.orgao = undefined; q.ano = undefined; q.prova = undefined; q.fonte = undefined; }
        QUESTIONS.push(q); existingIds.push(q.id); aceitas++;
      }
    }
    if (aceitas > 0) importReport = { status: rejeitadas === 0 ? 'ok' : 'warn', title: aceitas + ' importada(s); ' + rejeitadas + ' rejeitada(s).', messages: messages };
    else importReport = { status: 'err', title: 'Nenhuma questão importada.', messages: messages };
    render();
  }

  function downloadJson(filename, dataObj) {
    try {
      var blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
    } catch (e) { window.alert('Falha ao exportar: ' + e.message); }
  }

  function renderFlashcardResult() {
    var sess = window.__lastFlashSession;
    if (!sess) return '<h1 class="page-title">Nenhum resultado de flashcards</h1><button class="btn btn-primary" data-nav="flashcards">Ir para Flashcards</button>';
    var ids = sess.ids;
    var total = ids.length;
    var cSabia = 0, cDuvida = 0, cNao = 0;
    for (var i = 0; i < ids.length; i++) {
      var r = sess.respostas[ids[i]];
      if (r === 'sabia') cSabia++;
      else if (r === 'duvida') cDuvida++;
      else if (r === 'nao_sabia') cNao++;
    }
    var pctSabia = total > 0 ? Math.round((cSabia / total) * 100) : 0;
    var modoLabel = '';
    if (sess.modo === 'revisao') modoLabel = 'Revisão';
    var html = '';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" data-nav="flashcards">← Flashcards</button>';
    if (modoLabel === 'Revisão') html += '<button class="btn" data-nav="revisao">🔁 Revisão</button>';
    html += '</div></div>';
    html += '<h1 class="page-title">Sessão de flashcards concluída' + (modoLabel ? ' — ' + esc(modoLabel) : '') + '</h1>';
    html += '<p class="page-subtitle">Iniciada em ' + esc(formatDate(sess.startedAt)) + '</p>';
    html += '<div class="result-summary">';
    html += resultStat('Cartões estudados', total);
    html += resultStat('Eu sabia', cSabia);
    html += resultStat('Tive dúvida', cDuvida);
    html += resultStat('Não sabia', cNao);
    html += resultStat('Aproveitamento', pctSabia + '%');
    html += '</div>';
    html += '<h2 class="section-title">Detalhe da sessão</h2>';
    html += '<div class="fc-hist">';
    for (var j = 0; j < ids.length; j++) {
      var card = getFlashcard(ids[j]);

      var resp = sess.respostas[ids[j]];

      html += '<div class="fc-hist-row">';

    return html;
  }

  function renderRevision() {
    var dueQ = getDueQuestions();

    var dueF = getDueFlashcards();
    var todayF = getTodayFlashcards();
    var futureF = getFutureFlashcards();

    var html = '';
    html += '<h1 class="page-title">Revisão</h1>';

    html += '<div class="rev-summary">';
    html += '<div class="rev-stat due"><div class="rs-label">Vencidas</div><div class="rs-value">' + (dueQ.length + dueF.length) + '</div></div>';
    html += '<div class="rev-stat today"><div class="rs-label">Hoje</div><div class="rs-value">' + (todayQ.length + todayF.length) + '</div></div>';
    html += '<div class="rev-stat future"><div class="rs-label">Futuras</div><div class="rs-value">' + (futureQ.length + futureF.length) + '</div></div>';
    html += '<div class="rev-stat"><div class="rs-label">Total agendado</div><div class="rs-value">' + (dueQ.length + todayQ.length + futureQ.length + dueF.length + todayF.length + futureF.length) + '</div></div>';
    html += '</div>';

    var totalDue = dueQ.length + dueF.length;
    if (totalDue > 0) {
      html += '<div class="quick-actions">';
      if (dueQ.length > 0) html += '<button class="btn btn-primary" data-action="start-revision-questions">📝 Revisar ' + dueQ.length + ' questão(ões) vencida(s)</button>';
      if (dueF.length > 0) html += '<button class="btn btn-purple" data-action="start-revision-flashcards">🗂️ Revisar ' + dueF.length + ' flashcard(s) vencido(s)</button>';
      html += '</div>';
    }

    html += '<div class="rev-group">';
    html += '<h3>🔴 Vencidas <span class="count-badge">' + totalDue + '</span></h3>';
    if (totalDue === 0) html += '<div class="rev-empty"><strong>Nada vencido.</strong> Você está em dia com as revisões.</div>';
    else {
      for (var i = 0; i < dueQ.length; i++) html += renderRevItemQuestion(dueQ[i], 'Vencida');
      for (var i2 = 0; i2 < dueF.length; i2++) html += renderRevItemFlashcard(dueF[i2], 'Vencida');
    }
    html += '</div>';

    var totalToday = todayQ.length + todayF.length;
    html += '<div class="rev-group">';
    html += '<h3>🟠 Hoje <span class="count-badge">' + totalToday + '</span></h3>';
    if (totalToday === 0) html += '<div class="rev-empty">Sem revisões para hoje.</div>';
    else {
      for (var j = 0; j < todayQ.length; j++) html += renderRevItemQuestion(todayQ[j], 'Hoje');
      for (var j2 = 0; j2 < todayF.length; j2++) html += renderRevItemFlashcard(todayF[j2], 'Hoje');
    }
    html += '</div>';

    var totalFuture = futureQ.length + futureF.length;
    html += '<div class="rev-group">';
    html += '<h3>🟢 Próximas <span class="count-badge">' + totalFuture + '</span></h3>';
    if (totalFuture === 0) html += '<div class="rev-empty">Sem revisões futuras agendadas.</div>';
    else {
      var combined = [];
      for (var k = 0; k < futureQ.length; k++) combined.push({ tipo: 'q', item: futureQ[k].q, iso: futureQ[k].iso });
      for (var k2 = 0; k2 < futureF.length; k2++) combined.push({ tipo: 'f', item: futureF[k2].fc, iso: futureF[k2].iso });
      combined.sort(function (a, b) { return new Date(a.iso) - new Date(b.iso); });
      for (var m = 0; m < combined.length; m++) {
        var c = combined[m];
        var label = formatDateShort(c.iso);
        if (c.tipo === 'q') html += renderRevItemQuestion(c.item, label);
        else html += renderRevItemFlashcard(c.item, label);
      }
    }
    html += '</div>';

    html += '<h2 class="section-title">Como funciona</h2>';
    html += '<div class="notice">' +
      'Acertos aumentam gradualmente o intervalo até a próxima revisão (1 → 3 → 7 → 15 → 30 → 60 dias para questões; ' +
      '0 → 1 → 3 → 7 → 15 → 30 dias para flashcards). Erros reiniciam o ciclo.' +
      '</div>';

    html += footerHtml();
    return html;
  }

  function renderSimulados() {
    var totalReal = qRealCount();
    var poolSimulado = filterForSimulado();
    var qtdAlvoVal = quantidadeAlvo();
    var podeIniciar = poolSimulado.length > 0 && qtdAlvoVal > 0;
    var realPool = poolSimulado.filter(function (q) { return q.tipo === 'REAL'; });

    var areas = ['todas'].concat(Object.keys(AREA_LABELS));
    var areaPills = '';
    for (var i = 0; i < areas.length; i++) {
      var a = areas[i];
      var label = a === 'todas' ? 'Todas as áreas' : (AREA_LABELS[a] || a);
      var active = (simuladoConfig.area === a) ? ' active' : '';
      areaPills += '<button class="filter-pill' + active + '" data-sim-area="' + a + '">' + esc(label) + '</button>';
    }
    var moduleOptions = '<option value="todos">Todos os módulos</option>';
    for (var j = 0; j < MODULES.length; j++) {
      var mo = MODULES[j];
      var hasQ = QUESTIONS.some(function (q) { return q.moduloId === mo.id; });
      if (!hasQ && simuladoConfig.moduloId !== mo.id) continue;
      var sel = simuladoConfig.moduloId === mo.id ? ' selected' : '';
      moduleOptions += '<option value="' + esc(mo.id) + '"' + sel + '>' + esc(mo.id + ' — ' + mo.titulo) + '</option>';
    }
    var diffOptions = '';
    var diffs = [['todas','Todas as dificuldades'], ['1','Fácil'], ['2','Médio'], ['3','Difícil']];
    for (var d = 0; d < diffs.length; d++) {
      var sel2 = simuladoConfig.dificuldade === diffs[d][0] ? ' selected' : '';
      diffOptions += '<option value="' + diffs[d][0] + '"' + sel2 + '>' + esc(diffs[d][1]) + '</option>';
    }
    var tipoOptions = '';
    var tipos = [['TODAS','Todas'], ['DIDATICA','Somente didáticas'], ['REAL','Somente reais']];
    for (var t = 0; t < tipos.length; t++) {
      var sel3 = simuladoConfig.tipo === tipos[t][0] ? ' selected' : '';
      tipoOptions += '<option value="' + tipos[t][0] + '"' + sel3 + '>' + esc(tipos[t][1]) + '</option>';
    }
    var qtyPills = '';

      var val = qtyOpts[q][0];

      html += '<span class="badge-pill badge-real">PROVA DE CONCURSO</span>';
      html += '<span>Modo atual: <strong>Prova de concurso</strong> — só usa questões reais. Há <strong>' + totalReal + '</strong> cadastrada(s). ';
      html += 'Para usar todas as questões, mude para <strong>Simulado personalizado</strong>.</span>';

      html += '<span class="badge-pill badge-sim">SIMULADO</span>';
      html += '<span>Modo atual: <strong>Simulado personalizado</strong> — usa todas as questões (didáticas + reais).</span>';

    html += '</div>';

     ESTATISTICAS

  function getDailyActivity(days) {
    var map = {};
    var today = new Date(); today.setHours(0,0,0,0);
    for (var i = days - 1; i >= 0; i--) {
      var d = new Date(today); d.setDate(d.getDate() - i);
      var key = d.toISOString().slice(0, 10);
      map[key] = { date: key, label: d.getDate() + '/' + (d.getMonth() + 1), questions: 0, flashcards: 0, simulados: 0, total: 0 };
    }
    var qid, fid;
    for (qid in AppState.questions) {
      if (!AppState.questions.hasOwnProperty(qid)) continue;
      var hq = AppState.questions[qid].historico || [];
      for (var a = 0; a < hq.length; a++) {
        var kq = (hq[a].data || '').slice(0, 10);
        if (map[kq]) { map[kq].questions++; map[kq].total++; }
      }
    }
    for (fid in AppState.flashcards) {
      if (!AppState.flashcards.hasOwnProperty(fid)) continue;
      var hf = AppState.flashcards[fid].historico || [];
      for (var b = 0; b < hf.length; b++) {
        var kf = (hf[b].data || '').slice(0, 10);
        if (map[kf]) { map[kf].flashcards++; map[kf].total++; }
      }
    }
    for (var s = 0; s < AppState.simulados.length; s++) {
      var ks = (AppState.simulados[s].finalizadoEm || '').slice(0, 10);
      if (map[ks]) { map[ks].simulados++; map[ks].total++; }
    }
    var arr = [];
    for (var k in map) if (map.hasOwnProperty(k)) arr.push(map[k]);
    arr.sort(function (x, y) { return x.date < y.date ? -1 : 1; });
    return arr;
  }
  function getModulePerformance() {
    var out = [];
    for (var i = 0; i < MODULES.length; i++) {
      var m = MODULES[i];
      var tent = 0, ac = 0;
      for (var j = 0; j < QUESTIONS.length; j++) {
        if (QUESTIONS[j].moduloId !== m.id) continue;
        var qs = AppState.questions[QUESTIONS[j].id];
        if (!qs) continue;
        tent += qs.tentativas || 0;
        ac += qs.acertos || 0;
      }
      if (tent === 0) continue;
      out.push({ modulo: m, tentativas: tent, acertos: ac, pct: Math.round((ac / tent) * 100) });
    }
    out.sort(function (a, b) { return b.pct - a.pct; });
    return out;
  }
  function getDifficultyPerformance() {
    var bucket = { 1: { t: 0, a: 0 }, 2: { t: 0, a: 0 }, 3: { t: 0, a: 0 } };
    for (var i = 0; i < QUESTIONS.length; i++) {
      var qs = AppState.questions[QUESTIONS[i].id];
      if (!qs) continue;
      var d = QUESTIONS[i].dificuldade || 2;
      bucket[d].t += qs.tentativas || 0;
      bucket[d].a += qs.acertos || 0;
    }
    var out = [];
    var order = [1, 2, 3];
    for (var k = 0; k < order.length; k++) {
      var dk = order[k];
      if (bucket[dk].t === 0) continue;
      out.push({ label: DIFFICULTY_LABELS[dk], pct: Math.round((bucket[dk].a / bucket[dk].t) * 100), tentativas: bucket[dk].t });
    }
    return out;
  }
  function getTypePerformance() {
    var bucket = { REAL: { t: 0, a: 0 }, DIDATICA: { t: 0, a: 0 } };
    for (var i = 0; i < QUESTIONS.length; i++) {
      var qs = AppState.questions[QUESTIONS[i].id];
      if (!qs) continue;
      var t = QUESTIONS[i].tipo;
      if (!bucket[t]) continue;
      bucket[t].t += qs.tentativas || 0;
      bucket[t].a += qs.acertos || 0;
    }
    var out = [];
    if (bucket.REAL.t > 0) out.push({ label: 'Reais', pct: Math.round((bucket.REAL.a / bucket.REAL.t) * 100), tentativas: bucket.REAL.t });
    if (bucket.DIDATICA.t > 0) out.push({ label: 'Didáticas', pct: Math.round((bucket.DIDATICA.a / bucket.DIDATICA.t) * 100), tentativas: bucket.DIDATICA.t });
    return out;
  }
  function getErrorRanking() {
    var out = [];
    for (var i = 0; i < QUESTIONS.length; i++) {
      var qs = AppState.questions[QUESTIONS[i].id];
      if (!qs || !qs.erros) continue;
      out.push({ q: QUESTIONS[i], erros: qs.erros, tentativas: qs.tentativas, acertos: qs.acertos });
    }
    out.sort(function (a, b) { return b.erros - a.erros; });
    return out;
  }
  function getMasteryByModule() {
    var out = [];
    for (var i = 0; i < MODULES.length; i++) {
      var m = MODULES[i];
      var st = AppState.modules[m.id];
      if (!st) continue;
      var dom = st.dominioEstimado || 0;
      var tent = 0, ac = 0;
      for (var j = 0; j < QUESTIONS.length; j++) {
        if (QUESTIONS[j].moduloId !== m.id) continue;
        var qs = AppState.questions[QUESTIONS[j].id];
        if (!qs) continue;
        tent += qs.tentativas || 0;
        ac += qs.acertos || 0;
      }
      var pctQ = tent > 0 ? (ac / tent) : null;
      var estimado = dom;
      if (pctQ != null) estimado = (dom + pctQ) / 2;
      out.push({ modulo: m, dominio: Math.round(estimado * 100), tentativas: tent, temDados: dom > 0 || tent > 0 });
    }
    out.sort(function (a, b) { return b.dominio - a.dominio; });
    return out;
  }
  function estimateStudyMinutes() {
    var q = AppState.stats.questoesRespondidas || 0;
    var f = AppState.stats.flashcardsEstudados || 0;
    return q * 1 + Math.round(f * 0.5);
  }
  function formatMinutes(min) {
    if (!min) return '0 min';
    if (min < 60) return min + ' min';
    var h = Math.floor(min / 60);
    var m = min % 60;
    return h + 'h' + (m > 0 ? ' ' + m + 'min' : '');
  }

  function startDiagnostic(modId) {

  function answerDiag(altId) {
    var diag = getDiagnosticByModuleId(diagRunning.moduleId);
    if (!diag) return;
    var item = diag.itens[diagRunning.itemIndex];
    if (!item) return;
    if (Object.prototype.hasOwnProperty.call(diagRunning.answers, item.id)) return;

  function nextDiag() {
    var diag = getDiagnosticByModuleId(diagRunning.moduleId);
    if (!diag) return;
    if (diagRunning.itemIndex < diag.itens.length - 1) { diagRunning.itemIndex += 1; render(); var main = document.getElementById('main'); if (main) main.scrollTop = 0; }
  }
  function prevDiag() { if (diagRunning.itemIndex > 0) { diagRunning.itemIndex -= 1; render(); var main = document.getElementById('main'); if (main) main.scrollTop = 0; } }
  function cancelDiag() {
    var ok = window.confirm('Cancelar o diagnóstico? As respostas não serão salvas.');
    if (!ok) return;
    diagRunning.moduleId = null; diagRunning.answers = {}; diagRunning.itemIndex = 0;
    navigate('modulos');
  }
  function finishDiag() {
    var moduleId = diagRunning.moduleId;
    var diag = getDiagnosticByModuleId(moduleId);
    if (!diag) return;
    for (var i = 0; i < diag.itens.length; i++) {
      if (!Object.prototype.hasOwnProperty.call(diagRunning.answers, diag.itens[i].id)) {
        window.alert('Existem itens não respondidos. Volte e complete.');
        diagRunning.itemIndex = i; render(); return;
      }
    }
    var result = computeDiagnosticResult(moduleId, diagRunning.answers);
    var st = getModuleUserState(moduleId);
    st.diagnostico = { diagId: diag.id, answers: Object.assign({}, diagRunning.answers), result: result, completedAt: result.completedAt, tentativas: (st.diagnostico && st.diagnostico.tentativas ? st.diagnostico.tentativas : 0) + 1 };
    st.dominioEstimado = result.dominioEstimado;
    st.ultimaAtividade = new Date().toISOString();
    if (st.status === 'nao_iniciado') st.status = 'em_estudo';
    saveState();
    diagRunning.moduleId = null; diagRunning.answers = {}; diagRunning.itemIndex = 0;
    navigate('diag-resultado', { moduleId: moduleId });
  }

  function exportFullState() {

    };

  function validateIncomingState(obj) {
    var erros = [];
    if (!obj || typeof obj !== 'object') {
      return { erros: ['Arquivo inválido.'], state: null };
    }
    var state = obj.state || obj;
    if (typeof state !== 'object' || state === null) {
      return { erros: ['Estrutura "state" ausente ou inválida.'], state: null };
    }
    if (!state.schemaVersion) erros.push('Sem schemaVersion.');
    if (state.modules !== undefined && (typeof state.modules !== 'object' || state.modules === null)) erros.push('Campo "modules" com formato inesperado.');
    if (state.questions !== undefined && (typeof state.questions !== 'object' || state.questions === null)) erros.push('Campo "questions" com formato inesperado.');
    if (state.flashcards !== undefined && (typeof state.flashcards !== 'object' || state.flashcards === null)) erros.push('Campo "flashcards" com formato inesperado.');
    if (state.simulados !== undefined && !Array.isArray(state.simulados)) erros.push('Campo "simulados" deve ser array.');
    return { erros: erros, state: state };
  }

  function importFullStateFromText(text) {
    var parsed;
    try { parsed = JSON.parse(text); }
    catch (e) { window.alert('JSON inválido: ' + e.message); return; }
    var check = validateIncomingState(parsed);
    if (check.erros.length > 0) {
      window.alert('Backup rejeitado:\n\n- ' + check.erros.join('\n- '));
      return;
    }
    var st = check.state;
    var resumo = [
      'Módulos: ' + Object.keys(st.modules || {}).length,
      'Questões vistas: ' + Object.keys(st.questions || {}).length,
      'Flashcards vistos: ' + Object.keys(st.flashcards || {}).length,
      'Simulados: ' + ((st.simulados && st.simulados.length) || 0)
    ].join('\n');
    var ok = window.confirm(
      'Substituir o progresso atual pelo backup?\n\n' + resumo + '\n\n' +
      'A ação não pode ser desfeita.'
    );
    if (!ok) return;

    var base = createDefaultState();
    AppState = {
      schemaVersion: SCHEMA_VERSION,
      appVersion: APP_VERSION,
      createdAt: st.createdAt || base.createdAt,
      updatedAt: new Date().toISOString(),
      settings: Object.assign({}, base.settings, st.settings || {}),
      modules: st.modules || {},
      questions: st.questions || {},
      flashcards: st.flashcards || {},
      simulados: Array.isArray(st.simulados) ? st.simulados : [],
      stats: Object.assign({}, base.stats, st.stats || {}),
      lastScreen: 'dashboard'
    };
    saveState();
    applyTheme(AppState.settings && AppState.settings.theme);
    currentScreen = 'dashboard';
    currentModuleId = null;
    currentLessonId = null;
    render();
    window.alert('Backup restaurado com sucesso.');
  }
  function resetProgress() {
    var ok = window.confirm('Zerar todo o progresso?\n\nApaga módulos, diagnóstico, questões, flashcards, simulados, revisões e erros. Não é possível desfazer.');
    if (!ok) return;
    localStorage.removeItem(STORAGE_KEY);
    AppState = createDefaultState();
    saveState();
    currentScreen = 'dashboard'; currentModuleId = null; currentLessonId = null;
    moduleFilter = 'todas'; professorAnswerOpen = null;
    diagRunning = { moduleId: null, answers: {}, itemIndex: 0, revealed: {} };
    questionFilter = { area: 'todas', moduloId: 'todos', dificuldade: 'todas', tipo: 'TODAS' };
    questionRunning = null; window.__lastSession = null; importReport = null;
    flashcardFilter = { area: 'todas', moduloId: 'todos' };
    flashcardRunning = null; window.__lastFlashSession = null;
    simuladoConfig = { modo: 'SIMULADO', quantidade: 10, customQty: '', area: 'todas', moduloId: 'todos', dificuldade: 'todas', tipo: 'TODAS' };
    simuladoRunning = null; currentSimuladoId = null;
    render();
    window.alert('Progresso zerado.');
  }

  /* ============================================================
     EVENTOS
  ============================================================ */
  document.addEventListener('click', function (e) {
    var navEl = e.target.closest('[data-nav]');
    if (navEl) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }
    var mfEl = e.target.closest('[data-filter]');
    if (mfEl) { e.preventDefault(); setModuleFilter(mfEl.getAttribute('data-filter')); return; }
    var qfaEl = e.target.closest('[data-qf-area]');
    if (qfaEl) { e.preventDefault(); setQuestionFilterArea(qfaEl.getAttribute('data-qf-area')); return; }
    var fcfEl = e.target.closest('[data-fcf-area]');
    if (fcfEl) { e.preventDefault(); setFlashcardFilterArea(fcfEl.getAttribute('data-fcf-area')); return; }
    var simModeEl = e.target.closest('[data-sim-mode]');
    if (simModeEl) { e.preventDefault(); setSimuladoMode(simModeEl.getAttribute('data-sim-mode')); return; }
    var simQtyEl = e.target.closest('[data-sim-qty]');
    if (simQtyEl) { e.preventDefault(); setSimuladoQuantidade(simQtyEl.getAttribute('data-sim-qty')); return; }
    var simAreaEl = e.target.closest('[data-sim-area]');
    if (simAreaEl) { e.preventDefault(); setSimuladoArea(simAreaEl.getAttribute('data-sim-area')); return; }
    var actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    e.preventDefault();
    switch (action) {
      case 'toggle-sidebar': toggleSidebar(); break;
      case 'open-module': openModule(actionEl.getAttribute('data-module-id')); break;
      case 'open-lesson': openLesson(actionEl.getAttribute('data-lesson-id')); break;
      case 'mark-lesson-read': markLessonRead(actionEl.getAttribute('data-lesson-id')); break;
      case 'professor-answer': showProfessorAnswer(actionEl.getAttribute('data-lesson-id'), actionEl.getAttribute('data-key')); break;
      case 'start-diag': startDiagnostic(actionEl.getAttribute('data-module-id')); break;
      case 'open-diag-result': openDiagResult(actionEl.getAttribute('data-module-id')); break;
      case 'refazer-diag': refazerDiag(actionEl.getAttribute('data-module-id')); break;
      case 'diag-answer': answerDiag(actionEl.getAttribute('data-alt')); break;
      case 'diag-next': nextDiag(); break;
      case 'diag-prev': prevDiag(); break;
      case 'diag-cancel': cancelDiag(); break;
      case 'diag-finish': finishDiag(); break;
      case 'start-question-session': startQuestionSession(null, 'livre'); break;
      case 'answer-question': answerQuestion(actionEl.getAttribute('data-alt')); break;
      case 'next-question': nextQuestion(); break;
      case 'prev-question': prevQuestion(); break;
      case 'cancel-question-session': cancelQuestionSession(); break;
      case 'finish-question-session': finishQuestionSession(); break;
      case 'questions-by-module': startQuestionsByModule(actionEl.getAttribute('data-module-id')); break;
      case 'export-questions': exportQuestions(); break;
      case 'export-progress': exportProgress(); break;
      case 'import-questions': { var ta = document.getElementById('importTextarea'); if (ta) importQuestionsFromText(ta.value || ''); break; }
      case 'clear-import': clearImport(); break;
      case 'load-sample': loadImportSample(); break;
      case 'start-flashcards-all': startFlashcardsAll(); break;
      case 'start-flashcards-due': startFlashcardsDue(); break;
      case 'start-flashcards-by-module': startFlashcardsByModule(actionEl.getAttribute('data-module-id')); break;
      case 'flashcards-by-module': startFlashcardsByModule(actionEl.getAttribute('data-module-id')); break;
      case 'reveal-flashcard': revealFlashcard(); break;
      case 'answer-flashcard': answerFlashcard(actionEl.getAttribute('data-level')); break;
      case 'cancel-flashcard-session': cancelFlashcardSession(); break;
      case 'start-revision-questions': startRevisionQuestions(); break;
      case 'start-revision-flashcards': startRevisionFlashcards(); break;
      case 'start-errors-session': startErrorsSession(); break;
      case 'revisar-questao-unica': revisarQuestaoUnica(actionEl.getAttribute('data-question-id')); break;
      case 'revisar-flashcard-unico': revisarFlashcardUnico(actionEl.getAttribute('data-flashcard-id')); break;
      case 'start-simulado': startSimulado('SIMULADO'); break;
      case 'start-prova-concurso': startSimulado('PROVA_CONCURSO'); break;
      case 'sim-answer': answerSimulado(actionEl.getAttribute('data-alt')); break;
      case 'sim-clear-answer': clearSimuladoAnswer(); break;
      case 'sim-next': nextSimulado(); break;
      case 'sim-prev': prevSimulado(); break;
      case 'sim-goto': gotoSimuladoIndex(actionEl.getAttribute('data-index')); break;
      case 'sim-finish': finishSimulado(); break;
      case 'cancel-simulado': cancelSimulado(); break;
      case 'open-simulado-detail': openSimuladoDetail(actionEl.getAttribute('data-sim-id')); break;
      case 'delete-simulado': deleteSimulado(actionEl.getAttribute('data-sim-id')); break;
      case 'simulado-by-module': simuladoByModule(actionEl.getAttribute('data-module-id')); break;
      case 'simulado-com-filtros':
        simuladoConfig.area = questionFilter.area;
        simuladoConfig.moduloId = questionFilter.moduloId;
        simuladoConfig.dificuldade = questionFilter.dificuldade;
        simuladoConfig.tipo = questionFilter.tipo;
        simuladoConfig.modo = 'SIMULADO';
        navigate('simulados');
        break;
      case 'toggle-theme': toggleTheme(); break;
      case 'export-full-state': exportFullState(); break;
      case 'import-full-state': {
        var elFull = document.getElementById('importFullStateTextarea');
        if (elFull) importFullStateFromText(elFull.value || '');
        break;
      }
      case 'reset-progress': resetProgress(); break;
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el) return;
    if (el.id === 'qFilterModulo') setQuestionFilterModulo(el.value);
    else if (el.id === 'qFilterDificuldade') setQuestionFilterDificuldade(el.value);
    else if (el.id === 'qFilterTipo') setQuestionFilterTipo(el.value);
    else if (el.id === 'simFilterModulo') setSimuladoModulo(el.value);
    else if (el.id === 'simFilterDificuldade') setSimuladoDificuldade(el.value);
    else if (el.id === 'simFilterTipo') setSimuladoTipo(el.value);
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el) return;
    if (el.id === 'simCustomQty') setSimuladoCustomQty(el.value);
  });

  /* ============================================================
     INICIALIZACAO
  ============================================================ */
  function init() {
    AppState = loadState();
    applyTheme(AppState.settings && AppState.settings.theme);
    currentScreen = 'dashboard';
    currentModuleId = null;
    currentLessonId = null;
    moduleFilter = 'todas';
    professorAnswerOpen = null;
    diagRunning = { moduleId: null, answers: {}, itemIndex: 0, revealed: {} };
    questionFilter = { area: 'todas', moduloId: 'todos', dificuldade: 'todas', tipo: 'TODAS' };
    questionRunning = null;
    window.__lastSession = null;
    importReport = null;
    flashcardFilter = { area: 'todas', moduloId: 'todos' };
    flashcardRunning = null;
    window.__lastFlashSession = null;
    simuladoConfig = { modo: 'SIMULADO', quantidade: 10, customQty: '', area: 'todas', moduloId: 'todos', dificuldade: 'todas', tipo: 'TODAS' };
    simuladoRunning = null;
    currentSimuladoId = null;
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
